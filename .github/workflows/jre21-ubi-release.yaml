name: Build and push the UBI based JRE 21 image

on:
  push:
    branches:
      - main
    paths:
      - jre-ubi/21/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/jre-release-reusable.yaml
    with:
      image-name: jre21-ubi
      context: ./jre-ubi/21
    secrets:
      CR_PAT: ${{ secrets.CR_PAT }}
