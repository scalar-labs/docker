name: Build a JRE base image for the CI
# Checks a JRE image in pull requests, for example the ones that Dependabot creates to update the
# base image. This workflow never pushes the image, so it needs no secrets. The release workflows
# push the images after the merge.
#
# The caller workflows (jre<version>-ci.yaml and jre<version>-ubi-ci.yaml) run only when the pull
# request changes the files related to their image, so only the images that the pull request
# affects are built.

on:
  workflow_call:
    inputs:
      context:
        description: "Path of the directory that includes the Dockerfile (e.g., ./jre/21)"
        required: true
        type: string

env:
  CONTEXT: ${{ inputs.context }}

jobs:
  build:
    name: Build ${{ inputs.context }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release workflow uses the same script to decide the image tag. Run it here so that a
      # Dockerfile from which the JRE version cannot be taken is found before the merge.
      - name: Check that the JRE version can be taken from the Dockerfile
        id: version
        run: |
          jre_version=$(bash ci/get_jre_version.sh "${CONTEXT}")
          echo "jre-version=${jre_version}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build for the same platforms and with the same build arguments as the release workflows.
      # IMAGE_NAME is not passed, so the default value in the Dockerfile is used. IMAGE_RELEASE is
      # a dummy value because the build time is decided at the release.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          push: false
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.jre-version }}
            IMAGE_RELEASE=000000000000
          platforms: linux/amd64,linux/arm64/v8
